<!-- Add this inside the <main> tag, after the stream-container section -->
<section class="signaling-container">
    <h2>Conexión Remota</h2>
    
    <div>
        <button id="createOfferBtn">Crear Oferta (Emisor)</button>
        <textarea id="localDescription" placeholder="Oferta/Respuesta Local" rows="4"></textarea>
        <button id="copyLocalBtn">Copiar Link Local</button>
    </div>

    <div>
        <textarea id="remoteDescription" placeholder="Pegar Oferta/Respuesta Remota aquí" rows="4"></textarea>
        <button id="acceptOfferBtn">Aceptar Oferta (Receptor)</button>
    </div>

    <div>
        <textarea id="iceCandidateInput" placeholder="Pegar Candidato ICE Remoto aquí" rows="2"></textarea>
        <button id="addIceBtn">Agregar Candidato ICE</button>
    </div>
</section>
