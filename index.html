<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prensa Alternativa - Transmisión en Vivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Prensa Alternativa</h1>
        <p>Transmisión ciudadana en directo</p>
    </header>

    <main>
        <section class="stream-container">
            <div class="video-wrapper">
                <h2>Tu Señal (Local)</h2>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div class="video-wrapper">
                <h2>Señal Recibida (Remoto)</h2>
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="remoteStatus" class="status-indicator">Desconectado</div>
            </div>
        </section>

        <section class="controls">
            <button id="startStreamBtn">Iniciar Transmisión</button>
            <button id="stopStreamBtn" disabled>Detener Transmisión</button>
            <button id="startRecordBtn" disabled>Grabar</button>
            <button id="stopRecordBtn" disabled>Detener Grabación</button>
        </section>

        <!-- 🔹 SECCIÓN DE CONEXIÓN REMOTA - COMPLETA 🔹 -->
        <section class="connection-section">
            <h3>🔗 Conexión Remota</h3>
            <div class="connection-box">
                <button id="generateLinkBtn" disabled>Generar Código de Conexión</button>
                <button id="copyLinkBtn" style="display:none;">Copiar Código</button>
                
                <!-- Removed readonly attribute to allow pasting -->
                <textarea 
                    id="connectionCode" 
                    placeholder="Aquí aparecerá tu código, o pega el código de la otra persona aquí..." 
                    rows="5"
                ></textarea>

                <button id="connectBtn" disabled>Conectar con este Código</button>
                <p class="info-text">
                    <small>Copia el código generado, envíalo a la otra persona y pega aquí el código que te envíen ellos para conectarse.</small>
                </p>
            </div>
        </section>

        <section class="recording-output">
            <h2>Grabación Guardada</h2>
            <video id="recordedVideo" controls></video>
            <a id="downloadLink" download="prensa_alternativa.webm" style="display: none;">📥 Descargar Grabación</a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
