<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Ensure proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prensa Alternativa - Transmisión en Vivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Prensa Alternativa</h1>
        <p>Transmisión ciudadana en directo</p>
    </header>

    <main>
        <section class="stream-container">
            <div class="video-wrapper">
                <h2>Tu Señal (Local)</h2>
                <video id="localVideo" autoplay muted playsinline></video>
                <!-- Button to switch cameras on mobile -->
                <button id="switchCameraBtn" style="display:none;">Cambiar Cámara</button>
            </div>
            <div class="video-wrapper">
                <h2>Señal Recibida (Remoto)</h2>
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="remoteStatus" class="status-indicator">Desconectado</div>
            </div>
        </section>

        <section class="controls">
            <button id="startStreamBtn">Iniciar Transmisión</button>
            <button id="stopStreamBtn" disabled>Detener Transmisión</button>
            <button id="startRecordBtn" disabled>Grabar</button>
            <button id="stopRecordBtn" disabled>Detener Grabación</button>
        </section>

        <!-- 🔹 SECCIÓN DE CONEXIÓN REMOTA - MEJORADA 🔹 -->
        <section class="connection-section">
            <h3>🔗 Conexión Remota</h3>
            <div class="connection-box">
                <div class="step">
                    <label>Paso 1: Genera tu código y envíalo</label>
                    <button id="generateLinkBtn" disabled>Generar Código</button>
                    <button id="copyLinkBtn" style="display:none;">Copiar Código</button>
                </div>
                
                <div class="step">
                    <label>Paso 2: Pega el código recibido y conecta</label>
                    <textarea 
                        id="connectionCode" 
                        placeholder="Aquí aparecerá tu código, o pega el código de la otra persona aquí..." 
                        rows="4"
                    ></textarea>
                    <button id="connectBtn" disabled>Conectar con este Código</button>
                </div>
                
                <p class="info-text">
                    <small>Nota: Copia el código generado, envíalo a la otra persona por chat/correo, y pega aquí el código que ellos te envíen.</small>
                </p>
            </div>
        </section>

        <section class="recording-output">
            <h2>Grabación Guardada</h2>
            <video id="recordedVideo" controls playsinline></video>
            <a id="downloadLink" download="prensa_alternativa.webm" style="display: none;">📥 Descargar Grabación</a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
